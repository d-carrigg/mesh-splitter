name: Publish to OrcaCloud

# A GitHub release tagged vX.Y.Z builds the plugin at that version, attaches it to the release and
# publishes it to the OrcaCloud Plugin Hub. Auth is GitHub OIDC (no secrets): the plugin on OrcaCloud
# must have this repository connected under Edit plugin > GitHub publishing.
# Steps from https://cloud.orcaslicer.com/wiki/#publish-from-github
on:
  release:
    types: [published]

permissions:
  id-token: write
  contents: write

jobs:
  publish:
    if: startsWith(github.event.release.tag_name, 'v')
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: plugin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: plugin/package-lock.json
      - uses: astral-sh/setup-uv@v6
      - run: uv sync
      - run: npm ci
      - name: Build
        run: uv run python build.py --version "${GITHUB_REF_NAME#v}"
      - name: Unit tests
        run: uv run python test_plugin.py
      - name: Attach to the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" dist/mesh_splitter_any.py --clobber
      - name: Publish release to OrcaCloud
        run: |
          set -euo pipefail
          oidc_token="$(curl -sS -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=orcacloud" | jq -r .value)"
          version="${GITHUB_REF_NAME#v}"
          changelog="$(jq -r '.release.body // ""' "$GITHUB_EVENT_PATH" | head -c 4000)"
          metadata="$(jq -cn --arg version "$version" --arg changelog "$changelog" \
            '{version: $version} + (if $changelog == "" then {} else {changelog: $changelog} end)')"
          status="$(curl -sS -o response.json -w '%{http_code}' \
            -H "Authorization: Bearer $oidc_token" \
            -F "metadata=$metadata" -F "files=@dist/mesh_splitter_any.py" \
            https://api.orcaslicer.com/api/v1/plugin-publish/releases)"
          cat response.json
          echo
          [ "$status" = "201" ]
