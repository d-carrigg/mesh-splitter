name: Publish to OrcaCloud

# Runs when a vX.Y.Z GitHub release is published (by Release Please or by hand). It builds the plugin at that
# version, attaches the file to the release, and publishes it to the OrcaCloud Plugin Hub with the release
# notes as the changelog (converted to plain text by release_notes.py). Auth is GitHub OIDC (no secrets): the plugin on OrcaCloud
# must have this repository connected under Edit plugin > GitHub publishing.
# The official name and key need the repo Actions variable MESH_SPLITTER_NAME=meshsplitter (see build.py);
# without it the plugin is built and published as "Mesh Splitter (unofficial copy)".
# Steps from https://cloud.orcaslicer.com/wiki/#publish-from-github
on:
  release:
    types: [published]

permissions:
  id-token: write
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.ref_name }}
      MESH_SPLITTER_NAME: ${{ vars.MESH_SPLITTER_NAME }}   # read by build.py
    defaults:
      run:
        working-directory: plugin
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}
      - name: Changelog from the release notes (plain text; OrcaCloud does not render markdown)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release view "$TAG" --json body -q .body | python3 release_notes.py | head -c 4000 > ../changelog.txt
          cat ../changelog.txt
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: plugin/package-lock.json
      - uses: astral-sh/setup-uv@v10.4.0
      - run: uv sync
      - run: npm ci
      - name: Build (tag must match pyproject.toml)
        run: |
          want="$(grep -m1 '^version' ../pyproject.toml | cut -d'"' -f2)"
          [ "${TAG#v}" = "$want" ] || { echo "::error::tag $TAG != pyproject version $want"; exit 1; }
          if [ "$GITHUB_REPOSITORY" = d-carrigg/mesh-splitter ] && [ "$MESH_SPLITTER_NAME" != meshsplitter ]; then
            echo "::error::Set the Actions variable MESH_SPLITTER_NAME=meshsplitter, or this repo builds the unofficial copy"; exit 1
          fi
          uv run python build.py
          echo "WHL=$(ls dist/*.whl)" >> "$GITHUB_ENV"   # dist/mesh_splitter_any.whl, or the _copy_ name
      - name: Unit tests
        run: uv run python test_plugin.py
      - name: Attach the plugin to the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" "$WHL" --clobber
      - name: Publish release to OrcaCloud
        run: ./publish.sh "$TAG" "$WHL" ../changelog.txt
