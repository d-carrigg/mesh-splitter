name: Publish to OrcaCloud

# Runs when a vX.Y.Z GitHub release is published (by Release Please or by hand). It builds the plugin at that
# version, attaches the file to the release, and publishes it to the OrcaCloud Plugin Hub with the release
# notes as the changelog. Auth is GitHub OIDC (no secrets): the plugin on OrcaCloud
# must have this repository connected under Edit plugin > GitHub publishing.
# Steps from https://cloud.orcaslicer.com/wiki/#publish-from-github
on:
  release:
    types: [published]

permissions:
  id-token: write
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.ref_name }}
    defaults:
      run:
        working-directory: plugin
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - name: Changelog from the release notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release view "$TAG" --json body -q .body | head -c 4000 > ../changelog.txt
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: plugin/package-lock.json
      - uses: astral-sh/setup-uv@v6
      - run: uv sync
      - run: npm ci
      - name: Build (tag must match pyproject.toml)
        run: |
          want="$(grep -m1 '^version' ../pyproject.toml | cut -d'"' -f2)"
          [ "${TAG#v}" = "$want" ] || { echo "::error::tag $TAG != pyproject version $want"; exit 1; }
          uv run python build.py
      - name: Unit tests
        run: uv run python test_plugin.py
      - name: Attach the plugin to the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" dist/mesh_splitter_any.py --clobber
      - name: Publish release to OrcaCloud
        run: |
          set -euo pipefail
          oidc_token="$(curl -sS -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=orcacloud" | jq -r .value)"
          version="${TAG#v}"
          changelog="$(cat ../changelog.txt)"
          metadata="$(jq -cn --arg version "$version" --arg changelog "$changelog" \
            '{version: $version} + (if $changelog == "" then {} else {changelog: $changelog} end)')"
          status="$(curl -sS -o response.json -w '%{http_code}' \
            -H "Authorization: Bearer $oidc_token" \
            -F "metadata=$metadata" -F "files=@dist/mesh_splitter_any.py" \
            https://api.orcaslicer.com/api/v1/plugin-publish/releases)"
          cat response.json
          echo
          [ "$status" = "201" ]
