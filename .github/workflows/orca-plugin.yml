name: OrcaSlicer plugin

# Builds the Mesh Splitter plugin for OrcaSlicer (plugin/) from app/index.html and uploads dist/mesh_splitter_any.py (version: pyproject.toml [project].version). On main it also refreshes the "orca-plugin" release so the
# latest build has a stable download link.
# Tests (unit, end-to-end, real OrcaSlicer) run only on the release PR from Release Please
# (branch release-please--*) or when run by hand, so feature PRs and merges don't spend CI minutes on them.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:   # a newer push to the same branch cancels the older run
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    # Other PRs skip the job; main still builds the dev release.
    if: github.event_name != 'pull_request' || startsWith(github.head_ref, 'release-please--')
    runs-on: ubuntu-24.04   # matches OrcaSlicer's Ubuntu 24.04 AppImage used by the real OrcaSlicer test
    env:
      ORCA_VERSION: 2.5.1   # the OrcaSlicer release the plugin targets
      RUN_TESTS: ${{ startsWith(github.head_ref, 'release-please--') || github.event_name == 'workflow_dispatch' }}
    defaults:
      run:
        working-directory: plugin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: plugin/package-lock.json
      - uses: astral-sh/setup-uv@v6
      - name: Python deps (numpy, trimesh)
        run: uv sync
      - run: npm ci
      - name: Build
        run: uv run python build.py --page-out build/page.html   # version from pyproject.toml
      - name: Unit tests
        if: env.RUN_TESTS == 'true'
        run: |
          uv run python test_plugin.py
          uv run python ../server/test_llm_review.py
      - name: End-to-end (page + plugin bridge + multi-part 3MF)
        if: env.RUN_TESTS == 'true'
        run: |
          npm i --no-save playwright@1.49.1
          npx playwright install --with-deps chromium
          uv run python -c "import trimesh; a=trimesh.creation.icosphere(3,20); b=trimesh.creation.icosphere(3,13); b.apply_translation([0,0,30]); trimesh.util.concatenate([a,b]).export('build/snowman.stl')"
          mkdir -p build/out
          PYTHON="$(uv run which python)" node e2e.mjs build/snowman.stl build/out
          uv run python verify_3mf.py build/out/snowman_parts.3mf
      - name: Cache OrcaSlicer ${{ env.ORCA_VERSION }}
        if: env.RUN_TESTS == 'true'
        uses: actions/cache@v4
        with:
          path: ~/orca/orca.AppImage
          key: orcaslicer-${{ env.ORCA_VERSION }}-ubuntu2404
      - name: Real OrcaSlicer (install plugin, load it, read the plate, import the split 3MF)
        if: env.RUN_TESTS == 'true'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends xvfb x11-utils imagemagick locales \
            libwebkit2gtk-4.1-0 libegl1 libopengl0 libsecret-1-0 libwayland-server0 libgl1-mesa-dri
          sudo locale-gen en_US.UTF-8
          mkdir -p ~/orca && cd ~/orca
          [ -f orca.AppImage ] || curl -fsSL -o orca.AppImage \
            "https://github.com/OrcaSlicer/OrcaSlicer/releases/download/v${ORCA_VERSION}/OrcaSlicer_Linux_AppImage_Ubuntu2404_V${ORCA_VERSION}.AppImage"
          chmod +x orca.AppImage && ./orca.AppImage --appimage-extract >/dev/null   # no FUSE on runners
          cd "$GITHUB_WORKSPACE/plugin"
          LANG=en_US.UTF-8 xvfb-run -a -s "-screen 0 1600x1000x24" \
            uv run python real_orca_test.py ~/orca/squashfs-root/AppRun dist/mesh_splitter_any.py \
            build/snowman.stl build/out/snowman_parts.3mf --out build/real-orca
      - name: Upload real OrcaSlicer logs
        if: always() && env.RUN_TESTS == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: real-orca-${{ github.run_number }}
          path: plugin/build/real-orca
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: mesh_splitter-${{ github.run_number }}
          path: plugin/dist/mesh_splitter_any.py
      - name: Publish to the orca-plugin release
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes="Development build from main. Download mesh_splitter_any.py, then OrcaSlicer > Plugins > Install local plugin. Versioned releases are on the Releases page and the OrcaCloud Plugin Hub."
          gh release view orca-plugin >/dev/null 2>&1 || gh release create orca-plugin --title "Mesh Splitter dev build" --notes "$notes" --prerelease
          # Keep vX.Y.Z as "Latest"; this rolling build is a pre-release.
          gh release edit orca-plugin --title "Mesh Splitter dev build" --notes "$notes" --prerelease --latest=false
          gh release upload orca-plugin dist/mesh_splitter_any.py --clobber
