name: Command line

# Runs `mesh-splitter split` (cli/split.mjs on app/core.js) on a test mesh and checks the 3MFs it writes
# the way OrcaSlicer's importer reads them. Runs only on the release PR from Release Please
# (branch release-please--*) or when run by hand, to save CI minutes.
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  split:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.head_ref, 'release-please--')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - uses: astral-sh/setup-uv@v10
      - run: uv sync
      - run: npm ci
      - name: Golden outputs (same parts and files as test/golden.json)
        run: node test/golden.mjs
      - name: Test mesh (two spheres)
        run: |
          mkdir -p build
          uv run python -c "import trimesh; a=trimesh.creation.icosphere(3,20); b=trimesh.creation.icosphere(3,13); b.apply_translation([0,0,30]); trimesh.util.concatenate([a,b]).export('build/snowman.stl')"
          echo '[{"name":"Bottom","filament":3,"points":[[0,0,-20]]},{"name":"Top","points":[[0,0,43]]}]' > build/seeds.json
      - name: Split
        run: |
          uv run mesh-splitter split build/snowman.stl --shells -o build/shells.3mf --stl build/stl --painted build/painted.3mf
          uv run mesh-splitter split build/snowman.stl --seeds build/seeds.json -o build/seeds.3mf --save-session build/seeds.split.json
          uv run mesh-splitter split build/snowman.stl --session build/seeds.split.json -o build/session.3mf
          uv run mesh-splitter split build/snowman.stl --auto -o build/auto.3mf
          uv run mesh-splitter split build/snowman.stl --auto 4 -o build/auto4.3mf
          uv run mesh-splitter split examples/robot/robot.stl --auto 12 --filaments 4 -o build/robot_f4.3mf
          unzip -p build/robot_f4.3mf Metadata/model_settings.config | grep -o 'key="extruder" value="[0-9]*"' | sort -u | grep -qv 'value="[1-4]"' && { echo 'slot above 4'; exit 1; } || true
          test "$(ls build/stl/*.stl | wc -l)" = 2
          uv run mesh-splitter split build/shells.3mf --shells -o build/from3mf.3mf
      - name: Check the 3MFs
        working-directory: plugin
        run: |
          uv run python verify_3mf.py ../build/shells.3mf --parts 2
          uv run python verify_3mf.py ../build/seeds.3mf --parts 2
          uv run python verify_3mf.py ../build/session.3mf --parts 2
          uv run python verify_3mf.py ../build/auto.3mf
          uv run python verify_3mf.py ../build/auto4.3mf
          uv run python verify_3mf.py ../build/from3mf.3mf --parts 2
      - name: Examples (exact part count, recesses, inside-out input)
        run: |
          uv run mesh-splitter split examples/robot/robot.stl --auto 16 -o build/robot16.3mf
          uv run mesh-splitter split examples/rocket/rocket.stl -o build/rocket.3mf
          uv run python -c "import trimesh; m=trimesh.load('examples/bear/bear.stl'); m.invert(); m.export('build/bear_inside_out.stl')"
          uv run mesh-splitter split build/bear_inside_out.stl --seeds examples/bear/bear.seeds.json -o build/bear.3mf
          cd plugin
          uv run python verify_3mf.py ../build/robot16.3mf --parts 16
          uv run python verify_3mf.py ../build/rocket.3mf --parts 7
          uv run python verify_3mf.py ../build/bear.3mf --parts 9
