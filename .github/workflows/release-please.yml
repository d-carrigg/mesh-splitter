name: Release Please

# Every merge to main updates a "chore(main): release X.Y.Z" PR (version bump in pyproject.toml + CHANGELOG.md),
# built from the Conventional Commit titles (feat:, fix:, ...) of the merged PRs. Merging that release PR creates
# the vX.Y.Z GitHub release, and the publish job then builds the plugin and publishes it to OrcaCloud.
on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.rp.outputs.release_created }}
      tag_name: ${{ steps.rp.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: rp
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # A release made with GITHUB_TOKEN doesn't trigger other workflows, so publish from here.
  publish:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    permissions:
      id-token: write
      contents: write
    uses: ./.github/workflows/publish-orcacloud.yml
    with:
      tag: ${{ needs.release-please.outputs.tag_name }}
