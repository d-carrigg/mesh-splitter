name: Release Please

# Every merge to main updates a "chore(main): release X.Y.Z" PR (version bump in pyproject.toml + CHANGELOG.md),
# built from the Conventional Commit titles (feat:, fix:, ...) of the merged PRs. Merging that release PR creates
# the vX.Y.Z GitHub release, which runs publish-orcacloud.yml (release: published) to publish to OrcaCloud.
# Needs the RELEASE_PLEASE_TOKEN secret (fine-grained token, Contents + Pull requests: write): a release made
# with the default GITHUB_TOKEN doesn't start other workflows, and OrcaCloud only accepts a release-event run.
on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v5
        id: rp
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || github.token }}  # falls back so release PRs still update
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

